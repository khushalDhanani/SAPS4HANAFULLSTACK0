_schema-version: "3.3.0"
ID: SAPS4HANAFULLSTACK
version: 1.0.0
description: "SAP S/4HANA Full Stack Fiori and CAP Application"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # ------------------ BACKEND SERVICE (CAP) ------------------
  - name: saps4hana-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: saps4hana-auth
      - name: saps4hana-db
      - name: saps4hana-connectivity
      - name: saps4hana-destination

  # ------------------ DATABASE DEPLOYER (HANA) ------------------
  - name: saps4hana-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: saps4hana-db

  # ------------------ APPLICATION ROUTER ------------------
  - name: saps4hana-approuter
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: srv-api
        group: destinations
        properties:
          name: cap-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: saps4hana-auth
      - name: saps4hana-destination
      - name: saps4hana-html5-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  # ------------------ FIORI APPLICATION (BUILD) ------------------
  - name: saps4hana-fiori-app
    type: html5
    path: app/fiori-app
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build
      supported-platforms: []

  # ------------------ HTML5 APPLICATION DEPLOYER ------------------
  - name: saps4hana-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: saps4hana-fiori-app
          artifacts:
            - saps4hana-fiori-app.zip
          target-path: app/
    requires:
      - name: saps4hana-html5-repo-host
        parameters:
          content-target: true
      - name: saps4hana-auth

resources:
  # ------------------ XSUAA SERVICE ------------------
  - name: saps4hana-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: SAPS4HANAFULLSTACK-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api

  # ------------------ HANA HDI CONTAINER ------------------
  - name: saps4hana-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # ------------------ CONNECTIVITY SERVICE ------------------
  - name: saps4hana-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite

  # ------------------ DESTINATION SERVICE ------------------
  - name: saps4hana-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  # ------------------ HTML5 APP REPOSITORY HOST ------------------
  - name: saps4hana-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # ------------------ HTML5 APP REPOSITORY RUNTIME ------------------
  - name: saps4hana-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
