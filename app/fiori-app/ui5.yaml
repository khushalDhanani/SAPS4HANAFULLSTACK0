specVersion: "4.0"
metadata:
  name: saps4hana-fiori-app
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        backend:
          - path: /odata
            url: http://localhost:4004
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
          version: 1.136.22
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-proxy
      configuration:
        flp:
          theme: sap_horizon