name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - feature01
  pull_request:
    branches:
      - main
      - feature01
  workflow_dispatch:

jobs:
  ci:
    name: Build, Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            app/fiori-app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install UI5 application dependencies
        run: |
          cd app/fiori-app
          npm ci

      - name: Run root ESLint
        run: npm run lint

      - name: Run UI5 linter
        run: |
          cd app/fiori-app
          npm run lint

      - name: Run automated test suite
        run: |
          mkdir -p test-results
          npx jest --runInBand --ci --json --outputFile=test-results/jest-results.json

      - name: Publish test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            test/e2e/wm/screenshots/
          if-no-files-found: ignore

      - name: Build UI5 application
        run: |
          cd app/fiori-app
          npm run build

      - name: Publish UI5 build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fiori-app-dist
          path: app/fiori-app/dist/
          if-no-files-found: ignore

      - name: Validate MTA deployment descriptor
        run: npm run validate:mta
