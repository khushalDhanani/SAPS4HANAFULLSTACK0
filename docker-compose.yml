services:
  # ----------------------------------------------------------------------------
  # SAP CAP Backend Service & Fiori Host
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: saps4hana-fullstack:latest
    container_name: saps4hana-backend
    restart: unless-stopped
    ports:
      - "${PORT:-4004}:4004"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=4004
      - S4_SYSTEM_NAME=${S4_SYSTEM_NAME:-S4HANA_DEV}
      - S4_DESTINATION_URL=${S4_DESTINATION_URL:-https://s4hana.your-company.com:44300}
      - S4_CLIENT=${S4_CLIENT:-220}
      - S4_CONNECTION_TYPE=${S4_CONNECTION_TYPE:-abap_catalog}
      - S4_USERNAME=${S4_USERNAME:-}
      - S4_PASSWORD=${S4_PASSWORD:-}
      - S4_DESTINATION_NAME=${S4_DESTINATION_NAME:-S4HANA_PO_API}
      - EWM_WAREHOUSE_NUMBER=${EWM_WAREHOUSE_NUMBER:-}
      - SU_HU_SERVICE_PATH=${SU_HU_SERVICE_PATH:-}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4004/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Standalone SAP App Router (Dual-Container BTP Architecture)
  # Activated via: docker compose --profile approuter up
  # ----------------------------------------------------------------------------
  approuter:
    build:
      context: .
      dockerfile: app/router/Dockerfile
    image: saps4hana-approuter:latest
    container_name: saps4hana-approuter
    restart: unless-stopped
    profiles:
      - approuter
      - full
    ports:
      - "${ROUTER_PORT:-5000}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - destinations=[{"name":"srv-api","url":"http://backend:4004","forwardAuthToken":false},{"name":"cap-api","url":"http://backend:4004","forwardAuthToken":false}]
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
